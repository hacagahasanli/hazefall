<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0C1A17" />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="./site.webmanifest" />
    <title>%GAME_TITLE%</title>
    <meta name="author" content="%STUDIO_NAME%" />
    <meta name="description" content="A battle royale in your browser: ten players drop from a plane, loot guns and armor, and fight inside a shrinking safe zone until one is left." />
    <!-- CrazyGames SDK v3. If it cannot load (offline, another portal), the game runs without it. -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <style>
      html,body{margin:0;height:100%;background:#0a0d18}
      #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#ffd23f;font:700 22px system-ui,sans-serif;letter-spacing:.06em}
      #boot i{width:34px;height:34px;border:4px solid rgba(255,210,63,.25);border-top-color:#ffd23f;border-radius:50%;animation:s 0.8s linear infinite}
      @keyframes s{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><span>LOADING</span><i></i></div></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
