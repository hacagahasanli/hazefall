<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0C1A17" />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="./site.webmanifest" />
    <title>%GAME_TITLE%</title>
    <meta name="author" content="%STUDIO_NAME%" />
    <meta name="description" content="A battle royale in your browser: ten players drop from a plane, loot guns and armor, and fight inside a shrinking safe zone until one is left." />
    <!-- CrazyGames SDK v3. If it cannot load (offline, another portal), the game runs without it. -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <!--
      The boot screen: up from the first paint until the menu's live scene has drawn its first frame. Every number on it is
      real: the game code's bytes as they arrive (the build hands the loader the file and its size, see the boot-loader
      plugin in vite.portal.config.ts), then each step the game reports through window.__lcsBoot (src/lib/loading.ts):
      engine running, platform ready, menu up, each model file, first frame. Only transforms and opacity animate, so it keeps
      moving while the page is busy building the world.
    -->
    <style>
      html,body{margin:0;height:100%;background:#070a14}
      #boot{--g:#ffd23f;--gr:#3ddc84;--bl:#3ec5ff;--pk:#ff3d6e;--cr:#e6ebf5;position:fixed;inset:0;z-index:1000;overflow:hidden;background:radial-gradient(ellipse 80% 60% at 50% 38%,#13213a 0%,#0a0d18 55%,#05070e 100%);color:var(--cr);font:500 13px/1.45 'BootChakra',ui-monospace,SFMono-Regular,Menlo,monospace;-webkit-user-select:none;user-select:none;cursor:default}
      #boot *{box-sizing:border-box}
      #boot .all{position:absolute;inset:0;transform-origin:50% 50%}
      /* The floor: a perspective grid running towards you. */
      #boot .floor{position:absolute;left:-50%;right:-50%;bottom:-8%;height:62%;transform:perspective(420px) rotateX(64deg);transform-origin:50% 0;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 30%);mask-image:linear-gradient(to bottom,transparent 0%,#000 30%)}
      #boot .floor i{position:absolute;inset:-60px 0 0 0;background-image:linear-gradient(rgba(62,197,255,.38) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(62,197,255,.3) 1.5px,transparent 1.5px);background-size:60px 60px;animation:bFloor .9s linear infinite}
      #boot .horizon{position:absolute;left:0;right:0;top:38%;height:2px;background:linear-gradient(90deg,transparent,var(--bl) 30%,#fff 50%,var(--bl) 70%,transparent);opacity:.55;box-shadow:0 0 24px 4px rgba(62,197,255,.45)}
      #boot .scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
      #boot .sweep{position:absolute;left:0;right:0;top:-30%;height:30%;background:linear-gradient(to bottom,transparent,rgba(62,197,255,.07) 70%,rgba(62,197,255,.16));animation:bSweep 3.4s linear infinite;pointer-events:none}
      #boot .vig{position:absolute;inset:0;box-shadow:inset 0 0 160px 40px rgba(0,0,0,.75);pointer-events:none}
      /* HUD corner brackets. */
      #boot .c{position:absolute;width:28px;height:28px;border:2px solid rgba(62,197,255,.55)}
      #boot .c1{left:14px;top:14px;border-right:0;border-bottom:0}#boot .c2{right:14px;top:14px;border-left:0;border-bottom:0}
      #boot .c3{left:14px;bottom:14px;border-right:0;border-top:0}#boot .c4{right:14px;bottom:14px;border-left:0;border-top:0}
      /* The drop plane crossing high up, on its dashed route, with contrails. */
      #boot .route{position:absolute;left:-10%;right:-10%;top:17%;height:0;border-top:2px dashed rgba(255,210,63,.35);transform:rotate(-7deg)}
      #boot .plane{position:absolute;left:0;top:-17px;width:120px;height:34px;animation:bFly 6.5s linear infinite}
      #boot .plane svg{position:relative;width:100%;height:100%;filter:drop-shadow(0 0 10px rgba(255,210,63,.5))}
      #boot .plane b{position:absolute;right:96px;top:13px;width:220px;height:2px;background:linear-gradient(90deg,transparent,rgba(230,235,245,.55))}
      #boot .plane b+b{top:20px;width:160px}
      /* The middle column. */
      #boot .mid{position:absolute;left:50%;top:50%;width:min(560px,calc(100vw - 32px));transform:translate(-50%,-52%);display:flex;flex-direction:column;align-items:center;gap:18px}
      #boot .logo{position:relative;width:min(430px,82vw);aspect-ratio:1130/306}
      #boot .logo img{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 8px 28px rgba(0,0,0,.7))}
      #boot .logo img.r,#boot .logo img.b{opacity:.8;mix-blend-mode:screen}
      #boot .logo img.r{filter:sepia(1) saturate(9) hue-rotate(-50deg);animation:bGlitchR 2.8s steps(1) infinite}
      #boot .logo img.b{filter:sepia(1) saturate(9) hue-rotate(160deg);animation:bGlitchB 2.8s steps(1) infinite}
      #boot .logo::after{content:'';position:absolute;inset:-10% -4%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(-120%);animation:bShine 3.2s ease-in-out infinite;pointer-events:none}
      #boot .meter{width:100%;display:flex;align-items:flex-end;gap:14px}
      #boot .pct{font:400 46px/0.9 'BootBungee','BootChakra',Impact,sans-serif;color:var(--g);min-width:3.1em;text-shadow:-2px 0 rgba(255,61,110,.7),2px 0 rgba(62,197,255,.7),0 0 26px rgba(255,210,63,.35);font-variant-numeric:tabular-nums}
      #boot .pct small{font-size:.45em;margin-left:2px;opacity:.8}
      #boot .bar{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;padding-bottom:4px}
      #boot .now{font-weight:600;color:var(--cr);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:19px}
      #boot .now::after{content:'_';color:var(--gr);margin-left:2px;animation:bBlink .8s steps(1) infinite}
      #boot .segs{position:relative;height:14px;overflow:hidden;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);background:rgba(230,235,245,.08)}
      #boot .fill{position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--gr),var(--g));box-shadow:0 0 18px rgba(255,210,63,.6)}
      #boot .segs::before{content:'';position:absolute;inset:0;z-index:2;background:repeating-linear-gradient(90deg,transparent 0 9px,#0a0d18 9px 12px)}
      #boot .glint{position:absolute;top:0;bottom:0;left:0;z-index:1;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:bGlint 1.1s linear infinite}
      #boot .log{width:100%;height:118px;overflow:hidden;padding:9px 12px;background:rgba(5,8,16,.72);border:1px solid rgba(62,197,255,.22);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);display:flex;flex-direction:column;justify-content:flex-end;font-size:12px}
      #boot .log p{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:bLine .25s ease-out both;color:rgba(230,235,245,.78)}
      #boot .log p em{font-style:normal;color:rgba(139,147,173,.9);margin-right:8px}
      #boot .log p b{color:var(--gr);font-weight:700;margin-right:8px}
      #boot .tip{width:100%;min-height:42px;display:flex;align-items:center;gap:10px;font-size:14px;color:rgba(230,235,245,.86)}
      #boot .tip span{color:var(--g);font:400 22px/1 'BootBungee',Impact,sans-serif}
      #boot .tip q{quotes:none;animation:bTip .4s ease-out both}
      #boot .go{position:absolute;left:0;right:0;bottom:max(26px,env(safe-area-inset-bottom));text-align:center;font-weight:700;font-size:14px;color:var(--g);opacity:0}
      #boot.ready .go{opacity:1;animation:bBlink 1.2s steps(1) infinite .3s}
      /* The exit: a bright line across the middle, and the picture folds into it like an old monitor switching off. */
      #boot.out{pointer-events:none;background:transparent;transition:background .1s .2s}
      #boot.out .all{animation:bOff .42s cubic-bezier(.6,0,.9,.4) forwards}
      #boot.out::after{content:'';position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1px;background:#fff;box-shadow:0 0 30px 8px rgba(62,197,255,.8);animation:bLineOut .42s ease-out forwards}
      @keyframes bFloor{to{transform:translateY(60px)}}
      @keyframes bSweep{to{transform:translateY(430%)}}
      @keyframes bFly{0%{transform:translateX(-160px)}100%{transform:translateX(calc(120vw + 160px))}}
      @keyframes bGlitchR{0%,86%,100%{transform:none;clip-path:inset(0 0 100% 0)}87%{transform:translate(-6px,0);clip-path:inset(20% 0 55% 0)}90%{transform:translate(5px,0);clip-path:inset(62% 0 12% 0)}93%{transform:translate(-3px,0);clip-path:inset(5% 0 80% 0)}}
      @keyframes bGlitchB{0%,86%,100%{transform:none;clip-path:inset(0 0 100% 0)}88%{transform:translate(6px,0);clip-path:inset(40% 0 30% 0)}91%{transform:translate(-5px,0);clip-path:inset(75% 0 4% 0)}94%{transform:translate(3px,0);clip-path:inset(12% 0 70% 0)}}
      @keyframes bShine{0%,55%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
      @keyframes bBlink{50%{opacity:0}}
      @keyframes bGlint{from{transform:translateX(-100%)}to{transform:translateX(350%)}}
      @keyframes bLine{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
      @keyframes bTip{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      @keyframes bOff{0%{transform:none;opacity:1}45%{transform:scale(1.04,.012);opacity:1}100%{transform:scale(0,.004);opacity:0}}
      @keyframes bLineOut{0%{transform:scaleX(0);opacity:1}45%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
      @media (max-width:520px){#boot .pct{font-size:38px}#boot .log{height:100px;font-size:11px}#boot .route{top:13%}#boot .mid{gap:14px}}
      @media (max-height:460px){#boot .log{display:none}#boot .mid{gap:10px}#boot .logo{width:min(300px,60vw)}}
      @media (prefers-reduced-motion:reduce){#boot *,#boot *::before,#boot *::after,#boot.out::after{animation:none!important;transition:none!important}#boot .plane{display:none}}
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading">
      <div class="all">
        <div class="floor"><i></i></div>
        <div class="horizon"></div>
        <div class="route" aria-hidden="true">
          <div class="plane">
            <b></b><b></b>
            <svg viewBox="0 0 120 34" aria-hidden="true"><path fill="#ffd23f" d="M118 17c0-2-3-3.4-8-3.4H74L52 1h-9l12 12.6H22L13 5H6l4 12-4 12h7l9-8.6h33L43 33h9l22-12.6h36c5 0 8-1.4 8-3.4z"/><path fill="#0a0d18" opacity=".35" d="M96 15h4v2h-4zm-8 0h4v2h-4zm-8 0h4v2h-4z"/></svg>
          </div>
        </div>
        <div class="sweep"></div>
        <div class="mid">
          <div class="logo" aria-hidden="true"><img src="./brand/logo.svg" alt="" /><img class="r" src="./brand/logo.svg" alt="" /><img class="b" src="./brand/logo.svg" alt="" /></div>
          <div class="meter">
            <div class="pct"><span id="bootPct">0</span><small>%</small></div>
            <div class="bar">
              <div class="now" id="bootNow">Starting up</div>
              <div class="segs"><div class="fill" id="bootFill"></div><div class="glint"></div></div>
            </div>
          </div>
          <div class="log" id="bootLog" aria-hidden="true"></div>
          <div class="tip"><span aria-hidden="true">›</span><q id="bootTip"></q></div>
        </div>
        <div class="go" id="bootGo">Tap or press any key</div>
        <div class="c c1"></div><div class="c c2"></div><div class="c c3"></div><div class="c c4"></div>
        <div class="scan"></div>
        <div class="vig"></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var el = document.getElementById('boot');
        var pctEl = document.getElementById('bootPct');
        var fill = document.getElementById('bootFill');
        var now = document.getElementById('bootNow');
        var log = document.getElementById('bootLog');
        var tip = document.getElementById('bootTip');
        var t0 = performance.now();
        var at = 0, shown = 0, gone = false, out = false, ready = false, waiters = [];
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        var sec = function () { return ((performance.now() - t0) / 1000).toFixed(2) + 's'; };
        var line = function (text, ok) {
          var p = document.createElement('p');
          p.innerHTML = '<em>' + sec() + '</em>' + (ok ? '<b>OK</b>' : '');
          p.appendChild(document.createTextNode(text));
          log.appendChild(p);
          while (log.children.length > 7) log.removeChild(log.firstChild);
        };
        // The number counts up to the real value (never past it), so a jump reads as a quick count, not a teleport.
        var draw = function () {
          if (gone) return;
          shown += (at - shown) * (reduce ? 1 : 0.22);
          if (at - shown < 0.002) shown = at;
          pctEl.textContent = String(Math.floor(shown * 100));
          fill.style.transform = 'scaleX(' + shown + ')';
          requestAnimationFrame(draw);
        };
        requestAnimationFrame(draw);
        var set = function (v) { at = Math.max(at, Math.min(1, v)); };
        // Gameplay tips: only things the game really does.
        var TIPS = [
          'Jump from the plane whenever you like, then steer your parachute down.',
          'You land with a pistol and one magazine: grab a better gun fast.',
          'Blue and gold beams mark the best gear.',
          'Tall grass hides you.',
          '~Lean round corners with Q and E. Shift rolls out of trouble.',
          '~Two gun slots: 1 and 2 pick one, X swaps.',
          'Vests I to III soak up hits; a bigger backpack carries more heals.',
          'The safe zone closes phase by phase, and the Storm hurts more each time.',
          'Your super is ready when its bar turns gold.'
        ];
        // Tips that name keys (marked ~) only where there is a keyboard.
        var coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
        TIPS = TIPS.filter(function (t) { return !coarse || t.charAt(0) !== '~'; }).map(function (t) { return t.replace(/^~/, ''); });
        var ti = Math.floor(Math.random() * TIPS.length);
        var showTip = function () {
          var q = document.createElement('q');
          q.textContent = TIPS[ti++ % TIPS.length];
          tip.parentNode.replaceChild(q, tip);
          tip = q;
        };
        showTip();
        var tipTimer = setInterval(showTip, 3600);
        var finish = function () {
          if (out) return;
          out = true;
          clearInterval(tipTimer);
          el.className += ' out';
          window.removeEventListener('keydown', skip, true);
          window.removeEventListener('pointerdown', skip, true);
          setTimeout(function () {
            gone = true;
            if (el.parentNode) el.parentNode.removeChild(el);
            waiters.splice(0).forEach(function (fn) { try { fn(); } catch (e) {} });
          }, reduce ? 0 : 430);
        };
        // Once the menu is up underneath, any key or tap goes straight to it.
        var skip = function (e) { if (ready) { e.stopPropagation(); e.preventDefault(); finish(); } };
        window.addEventListener('keydown', skip, true);
        window.addEventListener('pointerdown', skip, true);
        window.__lcsBoot = {
          step: function (text, v) { line(text, true); set(v); },
          progress: function (v, live) { set(v); if (live) now.textContent = live; },
          ready: function () {
            if (ready) return;
            ready = true;
            el.className += ' ready';
            // A slow device building the scene never keeps the player from the menu for long.
            setTimeout(finish, 6000);
          },
          done: function () { set(1); now.textContent = 'Ready'; setTimeout(finish, reduce ? 0 : 280); },
          active: function () { return !gone; },
          onGone: function (fn) { if (gone) fn(); else waiters.push(fn); }
        };
        line('Last Commit Standing  ·  starting up', false);
        // The game code: fetched here with its bytes counted (the build gives the file and its size), then run as a module,
        // which the browser takes from its cache. Without that (the dev server) the page's own script tag loads it.
        var entry = window.__lcsEntry;
        if (!entry) { now.textContent = 'Loading game code'; return; }
        var kb = function (n) { return Math.round(n / 1024).toLocaleString('en-US'); };
        var started = performance.now();
        var run = function () {
          var s = document.createElement('script');
          s.type = 'module';
          s.crossOrigin = '';
          s.src = entry.src;
          document.head.appendChild(s);
        };
        now.textContent = 'Downloading game code';
        if (!window.fetch || !window.ReadableStream) { run(); return; }
        fetch(entry.src, { credentials: 'same-origin' }).then(function (r) {
          if (!r.ok || !r.body) throw new Error('no stream');
          var reader = r.body.getReader();
          var got = 0;
          var pump = function () {
            return reader.read().then(function (c) {
              if (c.done) return;
              got += c.value.length;
              window.__lcsBoot.progress(Math.min(1, got / entry.bytes) * 0.6, 'Downloading game code  ' + kb(got) + ' / ' + kb(entry.bytes) + ' KB');
              return pump();
            });
          };
          return pump().then(function () {
            window.__lcsBoot.step('Game code  ' + kb(got) + ' KB in ' + Math.round(performance.now() - started) + ' ms', 0.6);
            now.textContent = 'Starting the engine';
            run();
          });
        }).catch(function () { run(); });
      })();
    </script>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
