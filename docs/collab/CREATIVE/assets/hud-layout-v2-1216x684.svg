  <text x="1196" y="66" fill="#e6ebf5" font-size="11" text-anchor="end">kill feed, max 5 lines</text>

  <!-- Inventory column (right). Slot 1 active: pulled out 10 px -->
  <rect x="1018" y="416" width="186" height="40" fill="#0a0d18" fill-opacity="0.9"/>
