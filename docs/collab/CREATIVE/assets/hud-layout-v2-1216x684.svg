  <text x="152" y="621" fill="#e6ebf5" font-size="10">V coffee 1/2</text>
  <text x="72" y="642" fill="#ff8a3d" font-size="11">Blaze</text>
  <text x="272" y="642" fill="#3ec5ff" font-size="10" text-anchor="end">45</text>
  <rect x="72" y="647" width="200" height="5" fill="#3ec5ff"/>
