  <rect x="508" y="12" width="200" height="30" fill="#0a0d18" fill-opacity="0.85"/>
  <text x="608" y="32" fill="#e6ebf5" font-size="13" text-anchor="middle">Haze closing <tspan fill="#ffd23f">42s</tspan></text>

