<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1216 684" width="1216" height="684" font-family="Chakra Petch, sans-serif">
  <!-- HUD layout v2 wireframe at the CrazyGames default iframe, 1216x684, --hud = 1. Boxes are placement only, not the final look. -->
  <rect width="1216" height="684" fill="#3b5a3a"/>
  <rect x="12" y="12" width="1192" height="660" fill="none" stroke="#e6ebf5" stroke-opacity="0.15" stroke-dasharray="4 4"/>

  <!-- Minimap top left -->
  <rect x="12" y="12" width="168" height="168" fill="#0a0d18" fill-opacity="0.8"/>
  <rect x="16" y="16" width="160" height="160" fill="#5d8a4a"/>
  <circle cx="96" cy="96" r="62" fill="none" stroke="#e6ebf5" stroke-width="1.5"/>
