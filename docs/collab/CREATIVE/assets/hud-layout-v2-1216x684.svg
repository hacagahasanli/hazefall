  <text x="608" y="582" fill="#e6ebf5" font-size="13" text-anchor="middle">hint line (bottom 92)</text>
  <rect x="504" y="540" width="208" height="8" fill="#0a0d18" fill-opacity="0.8"/>
  <rect x="504" y="540" width="120" height="8" fill="#3ddc84"/>
