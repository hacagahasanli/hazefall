  <text x="1122" y="528" fill="#e6ebf5" font-size="11">band.</text>
  <text x="1196" y="529" fill="#e6ebf5" font-size="14" text-anchor="end">2<tspan fill-opacity="0.45" font-size="11">/4</tspan></text>

  <rect x="1084" y="542" width="120" height="30" fill="none" stroke="#e6ebf5" stroke-opacity="0.18" stroke-dasharray="3 3"/>
  <text x="1099" y="561" fill="#e6ebf5" fill-opacity="0.5" font-size="11" text-anchor="middle">4</text>
