  <text x="1043" y="484" fill="#e6ebf5" font-size="11" text-anchor="middle">2</text>
  <text x="1105" y="485" fill="#e6ebf5" fill-opacity="0.6" font-size="11" text-anchor="middle">shotgun</text>
  <text x="1196" y="486" fill="#e6ebf5" fill-opacity="0.6" font-size="15" text-anchor="end">6</text>

  <rect x="1084" y="508" width="120" height="30" fill="#0a0d18" fill-opacity="0.72"/>
