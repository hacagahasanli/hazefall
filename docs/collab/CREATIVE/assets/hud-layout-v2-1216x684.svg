  <rect x="72" y="608" width="34" height="18" fill="#0a0d18" fill-opacity="0.75"/>
  <rect x="110" y="608" width="34" height="18" fill="#0a0d18" fill-opacity="0.75"/>
  <rect x="148" y="608" width="56" height="18" fill="#0a0d18" fill-opacity="0.75"/>
